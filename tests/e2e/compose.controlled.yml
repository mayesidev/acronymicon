name: acronymicon-controlled-e2e

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: https://keycloak.localtest.me:8443
      KC_HTTPS_CERTIFICATE_FILE: /certs/cert.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/key.pem
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ${ACRONYMICON_E2E_REALM_PATH}:/opt/keycloak/data/import/realm-acronymicon.json:ro
      - ${ACRONYMICON_E2E_CERT_DIR}:/certs:ro
