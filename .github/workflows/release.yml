name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to verify and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish release container
    needs: verify
    uses: ./.github/workflows/publish-container.yml
    with:
      release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

  create-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --verify-tag \
              --generate-notes \
              --title "Acronymicon $RELEASE_TAG"
          fi
