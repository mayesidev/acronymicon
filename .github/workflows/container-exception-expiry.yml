name: Container exception expiry

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expiry:
    name: Check container exception expiry
    runs-on: ubuntu-26.04

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Enforce exception expiry
        run: node scripts/check-container-scan.mjs --check-expiry security/container-scan-exceptions.json
