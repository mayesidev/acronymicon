allowBuilds:
  # The package includes the Linux binaries used by the production image.
  better-sqlite3: false
  esbuild: true
blockExoticSubdeps: true
engineStrict: true
overrides:
  "@esbuild-kit/core-utils>esbuild": 0.28.2
# Delay newly published packages long enough for registry takeovers to be detected.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
nodeVersion: 24.19.0
# Keep downgrade detection enabled while tolerating trust metadata gaps on old packages.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
